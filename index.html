<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jolus Services - Facturación Electrónica SRI</title>
    <style>
      /* Pre-React Loading Screen */
      #initial-app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0f172a;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        z-index: 99999;
      }
      .loader-spinner {
        width: 44px;
        height: 44px;
        border: 3.5px solid rgba(99, 102, 241, 0.2);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: loader-spin 0.8s linear infinite;
      }
      @keyframes loader-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      // 1. Silent Ignore for Vite Websockets
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (
          (e.reason.message && (e.reason.message.includes('WebSocket') || e.reason.message.includes('websocket'))) ||
          (typeof e.reason === 'string' && (e.reason.includes('WebSocket') || e.reason.includes('websocket')))
        )) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });

      // 2. Vite Dynamic Import & Preload Error Recovery
      window.addEventListener('vite:preloadError', function(event) {
        if (event) event.preventDefault();
        console.warn('[AutoUpdate] Error al precargar nuevos módulos. Actualizando aplicación...');
        var lastReload = sessionStorage.getItem('last_auto_update_ts');
        var now = Date.now();
        if (!lastReload || (now - parseInt(lastReload, 10) > 3000)) {
          sessionStorage.setItem('last_auto_update_ts', String(now));
          window.location.replace(window.location.pathname + '?_update=' + now);
        }
      });

      // 3. Module & Chunk Loading Failures Recovery
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? e.message : '';
        if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('[vite] failed to connect')) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return;
        }

        if (
          msg.includes('dynamically imported module') ||
          msg.includes('Failed to fetch dynamically imported module') ||
          msg.includes('error loading dynamically imported module') ||
          msg.includes('Importing a module script failed') ||
          msg.includes('Loading chunk') ||
          msg.includes('is not a valid JavaScript MIME type')
        ) {
          console.warn('[AutoUpdate] Módulo obsoleto detectado tras despliegue. Recargando...', msg);
          var lastReload = sessionStorage.getItem('last_auto_update_ts');
          var now = Date.now();
          if (!lastReload || (now - parseInt(lastReload, 10) > 3000)) {
            sessionStorage.setItem('last_auto_update_ts', String(now));
            window.location.replace(window.location.pathname + '?_update=' + now);
          }
        }
      }, true);

      // 4. Blank Screen Watchdog (Prevents white screens if load halts mid-update)
      setTimeout(function() {
        var rootEl = document.getElementById('root');
        if (rootEl && rootEl.getAttribute('data-mounted') !== 'true') {
          var lastWatchdog = sessionStorage.getItem('watchdog_update_ts');
          var now = Date.now();
          if (!lastWatchdog || (now - parseInt(lastWatchdog, 10) > 5000)) {
            console.warn('[Watchdog] Aplicación no montada tras actualización. Forzando recarga...');
            sessionStorage.setItem('watchdog_update_ts', String(now));
            window.location.replace(window.location.pathname + '?_v=' + now);
          }
        }
      }, 2500);
    </script>
  </head>
  <body>
    <div id="root">
      <div id="initial-app-loader">
        <div class="loader-spinner"></div>
        <div style="margin-top: 16px; font-weight: 700; font-size: 14px; letter-spacing: -0.01em;">
          Facturación Electrónica SRI
        </div>
        <div style="margin-top: 6px; font-size: 12px; color: #94a3b8;">
          Cargando la versión más reciente...
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
