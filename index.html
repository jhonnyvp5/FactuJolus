<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jolus Services - Facturación Electrónica SRI</title>
    <script>
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (
          (e.reason.message && (e.reason.message.includes('WebSocket') || e.reason.message.includes('websocket'))) ||
          (typeof e.reason === 'string' && (e.reason.includes('WebSocket') || e.reason.includes('websocket')))
        )) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('websocket') || e.message.includes('[vite]'))) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
